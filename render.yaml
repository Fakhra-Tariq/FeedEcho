# FeedEcho — Render Blueprint
# Docs: https://render.com/docs/blueprint-spec
#
# REQUIRED env (set in Render dashboard after deploy):
#   API service (feedecho-api):
#     CLIENT_URL=https://feedecho-web.onrender.com
#   Static site (feedecho-web):
#     REACT_APP_API_URL=https://feedecho-api.onrender.com/api
#
# FREE-TIER COLD STARTS:
#   Web services on plan: free spin down after ~15 minutes idle.
#   The first request after idle can take 30–90 seconds to respond.
#   This is expected Render behavior — not an app bug.
#   Mitigations (pick one):
#     1. Upgrade feedecho-api to a paid plan (no spin-down) — best UX
#     2. External keep-alive ping every 10–14 min (e.g. UptimeRobot, cron-job.org)
#        hitting https://feedecho-api.onrender.com/api/health
#     3. Keep current free tier — frontend now retries/waits up to ~90s on cold start

services:
  - type: web
    name: feedecho-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_PRIVATE_KEY_ID
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_CLIENT_ID
        sync: false
      - key: FIREBASE_AUTH_URI
        value: https://accounts.google.com/o/oauth2/auth
      - key: FIREBASE_TOKEN_URI
        value: https://oauth2.googleapis.com/token
      - key: FIREBASE_AUTH_PROVIDER_X509_CERT_URL
        value: https://www.googleapis.com/oauth2/v1/certs
      - key: FIREBASE_CLIENT_X509_CERT_URL
        sync: false
      - key: FIREBASE_DATABASE_URL
        sync: false
      # Recommended on Render (paste full service account JSON as one line):
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: STUDY_ASSISTANT_GEMINI_MODEL
        value: gemini-2.5-flash-lite

  - type: web
    name: feedecho-web
    runtime: static
    plan: free
    buildCommand: npm install && npm --prefix client install && npm run build
    staticPublishPath: client/build
    envVars:
      - key: REACT_APP_API_URL
        sync: false
      - key: REACT_APP_FIREBASE_API_KEY
        sync: false
      - key: REACT_APP_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: REACT_APP_FIREBASE_DATABASE_URL
        sync: false
      - key: REACT_APP_FIREBASE_PROJECT_ID
        sync: false
      - key: REACT_APP_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: REACT_APP_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: REACT_APP_FIREBASE_APP_ID
        sync: false
      - key: REACT_APP_FIREBASE_MEASUREMENT_ID
        sync: false
